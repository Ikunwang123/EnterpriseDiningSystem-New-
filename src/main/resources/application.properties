# Server Configuration
server.port=8080
server.servlet.context-path=/

# Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/office_supply?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL5InnoDBDialect

# 静态资源缓存策略
# 默认（不设置）会让浏览器对 HTML/JS/CSS 使用"启发式缓存"自行决定缓存时长，
# 于是改了前端代码后浏览器仍加载旧文件，表现为"改了没效果"，
# 排查时极易误判成后端问题（本项目已多次踩到）。
# 这里统一不缓存，确保每次刷新都能拿到最新前端代码。
spring.web.resources.cache.period=0
spring.web.resources.chain.cache=false
